name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install API and PDF dependencies
        run: pip install fastapi uvicorn python-multipart httpx pypdfium2 openpyxl

      - name: Unit + API tests
        run: python -m unittest -v

      - name: Fault-detection eval (must stay at 100%)
        run: |
          python - <<'PY'
          from ira.eval import evaluate
          r = evaluate(count=200)
          print(r)
          assert r["precision"] == 1.0 and r["recall"] == 1.0 and r["clean_pass_rate"] == 1.0, r
          PY

      - name: Agent smoke run on synthetic invoices
        run: |
          python -m ira.synth
          python -m ira.agent data/synthetic_invoices.json --out out
          test -s out/readiness_report.json
          ls out/*.xml | head -3

  pint-ae:
    name: Official PINT AE rules (OpenPeppol Schematron)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install saxonche
      - name: Validate 100 generated documents (80 invoices, 20 credit notes) against official PINT AE v1.0.3
        run: python -m benchmarks.pint_ae_check --count 100
      - name: Agent vs official rules on official examples and 120 mutants
        run: |
          python - <<'PY'
          from pathlib import Path
          from benchmarks.agreement import run
          r = run(Path(".cache/pint-ae-1.0.3"))
          print(r)
          assert not r["false_alarms_on_official"], r["false_alarms_on_official"]
          assert r["agreement_pct"] == 100.0, r["per_mutation"]
          PY

  web:
    name: Web UI (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t qaid:ci .
      - name: Run and smoke-test
        run: |
          docker run -d --name qaid -p 8000:8000 qaid:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/ > /dev/null
          curl -sf -X PUT localhost:8000/api/profile -H 'content-type: application/json' \
            -d '{"name":"Al Noor Building Materials LLC","address":"Deira, Dubai","payment_terms_days":"30"}'
          curl -sf -F "files=@tests/fixtures/register_lines_en.xlsx" localhost:8000/api/invoices/upload \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['imports'][0]['invoices']==2, d; print('import ok')"
          test "$(docker exec qaid id -un)" = qaid
      - name: Logs on failure
        if: failure()
        run: docker logs qaid || true
